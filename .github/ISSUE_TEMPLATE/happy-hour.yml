name: "🍻 Add a happy hour"
description: Tell us about a happy hour that's missing from the app.
title: "Happy hour: "
labels: ["happy hour"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! We check every suggestion before it goes in the app, so please include where you saw it.
  - type: input
    id: venue
    attributes:
      label: Venue name
      placeholder: The Local Arms
    validations:
      required: true
  - type: input
    id: suburb
    attributes:
      label: Suburb and city
      placeholder: Newtown, Sydney
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: Days and times
      placeholder: Mon–Fri, 4 pm to 6 pm
    validations:
      required: true
  - type: textarea
    id: deal
    attributes:
      label: The deal
      placeholder: $7 schooners and house wines, $12 cocktails
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where did you see it?
      description: A link to the venue's website, menu or social post is best.
      placeholder: https://
    validations:
      required: true
  - type: checkboxes
    id: current
    attributes:
      label: Still on?
      options:
        - label: I've seen this happy hour in the last month.
