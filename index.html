<style>
  :root {
    --bg: #fff6ee;
    --card: #ffffff;
    --text: #1a0b2e;
    --muted: #6b5a7a;
    --line: #f0e2d6;
    --chip: #ffffff;
    --chip-line: #ecdccf;
    --pink: #ff3d8b;
    --orange: #ff8a1f;
    --yellow: #ffd23f;
    --purple: #7b3fe4;
    --teal: #12c2a6;
    --sunset: linear-gradient(120deg, #ff3d8b 0%, #ff8a1f 55%, #ffd23f 100%);
    --hero-text: #ffffff;
    --on: #0b8f5a;
    --on-bg: #d9f8e9;
    --soon: #b35300;
    --soon-bg: #ffecc8;
    --off: #6b5a7a;
    --off-bg: #f2eaf5;
    --shadow: 0 2px 0 rgba(26, 11, 46, .06), 0 10px 30px rgba(255, 61, 139, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12081f;
      --card: #1e1030;
      --text: #fff4fb;
      --muted: #b9a6cc;
      --line: #2f1d47;
      --chip: #22133a;
      --chip-line: #3a2558;
      --on: #3df2a5;
      --on-bg: #0f3a2c;
      --soon: #ffc14d;
      --soon-bg: #3d2a10;
      --off: #b9a6cc;
      --off-bg: #2a1a40;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .display { font-family: Unbounded, Inter, system-ui, sans-serif; letter-spacing: -.01em; }

  /* ---- Top banner ---- */
  .hero {
    position: relative;
    overflow: hidden;
    background: var(--sunset);
    color: var(--hero-text);
    padding: calc(env(safe-area-inset-top) + 28px) 16px 64px;
    border-radius: 0 0 32px 32px;
  }
  .hero-inner { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }
  .logo {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(26, 11, 46, .18);
    border-radius: 999px; padding: 6px 12px 6px 8px;
    font-weight: 700; font-size: 14px;
  }
  .logo span { font-size: 18px; line-height: 1; }
  .hero h1 { margin: 18px 0 0; font-size: 44px; line-height: 1; font-weight: 800; text-shadow: 0 3px 0 rgba(26, 11, 46, .15); }
  .hero p { margin: 10px 0 0; font-size: 17px; font-weight: 500; opacity: .95; }
  .bubble { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .22); animation: rise 9s linear infinite; }
  .bubble:nth-child(1) { width: 18px; height: 18px; right: 12%; bottom: -20px; animation-delay: 0s; }
  .bubble:nth-child(2) { width: 10px; height: 10px; right: 26%; bottom: -20px; animation-delay: 2.5s; animation-duration: 7s; }
  .bubble:nth-child(3) { width: 26px; height: 26px; right: 4%; bottom: -30px; animation-delay: 4s; animation-duration: 11s; }
  .bubble:nth-child(4) { width: 12px; height: 12px; right: 38%; bottom: -20px; animation-delay: 6s; }
  .hero-glass { position: absolute; right: -6px; top: calc(env(safe-area-inset-top) + 18px); font-size: 92px; transform: rotate(12deg); opacity: .95; }
  @keyframes rise {
    from { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    to { transform: translateY(-260px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none; display: none; } }

  .wrap {
    max-width: 640px;
    margin: -40px auto 0;
    padding: 0 max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
    position: relative;
    z-index: 2;
  }

  /* ---- Controls ---- */
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips + .chips { margin-top: 10px; }
  .chip {
    flex: none;
    border: 1.5px solid var(--chip-line);
    background: var(--chip);
    color: var(--text);
    border-radius: 999px;
    padding: 9px 15px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .chip:active { transform: scale(.96); }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .surprise {
    width: 100%;
    margin-top: 12px;
    border: 0;
    border-radius: 16px;
    padding: 14px 16px;
    background: var(--sunset);
    color: #1a0b2e;
    font: 800 16px/1.2 Unbounded, Inter, system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(26, 11, 46, .18);
    transition: transform .12s ease;
  }
  .surprise:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(26, 11, 46, .18); }

  .note { margin: 14px 4px 0; font-size: 14px; color: var(--muted); min-height: 20px; }

  /* ---- Bar cards ---- */
  .list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 14px; }
  .card {
    --accent: var(--pink);
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 18px 18px 16px 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--accent); }
  .card:nth-child(4n+2) { --accent: var(--orange); }
  .card:nth-child(4n+3) { --accent: var(--purple); }
  .card:nth-child(4n+4) { --accent: var(--teal); }
  .card.picked { animation: pop .6s ease; box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
  @keyframes pop { 40% { transform: scale(1.03) rotate(-.6deg); } }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .name { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.2; }
  .where { margin: 4px 0 0; color: var(--muted); font-size: 14px; font-weight: 500; }
  .badge {
    flex: none;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge.on { color: var(--on); background: var(--on-bg); }
  .badge.on::before {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; margin-right: 6px; vertical-align: 1px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }
  .badge.soon { color: var(--soon); background: var(--soon-bg); }
  .badge.off { color: var(--off); background: var(--off-bg); }

  .deal {
    margin: 14px 0 0;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.35;
  }
  .hours { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .go {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--text); color: var(--bg);
    text-decoration: none; font-weight: 700; font-size: 14px;
    border-radius: 999px; padding: 9px 14px;
  }
  .src { color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  .checked { color: var(--muted); font-size: 12px; margin-left: auto; }

  .empty {
    text-align: center;
    padding: 36px 20px;
    background: var(--card);
    border: 1.5px dashed var(--chip-line);
    border-radius: 24px;
  }
  .empty .big { font-size: 44px; line-height: 1; }
  .empty h2 { margin: 12px 0 4px; font-size: 20px; }
  .empty p { margin: 0; color: var(--muted); }
  .empty .chip { margin-top: 16px; }

  footer { margin-top: 32px; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; }
  footer a { color: var(--pink); font-weight: 600; }
</style>
</head>
<body>
<header class="hero">
  <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
  <div class="hero-glass" aria-hidden="true">🍹</div>
  <div class="hero-inner">
    <div class="logo"><span aria-hidden="true">🍻</span> Happy Hour</div>
    <h1 class="display">Thirsty?</h1>
    <p>Cheap drinks near you, right now.</p>
  </div>
</header>

<div class="wrap">
  <div class="panel">
    <div class="chips" role="group" aria-label="Where">
      <button class="chip" data-place="near" aria-pressed="false">📍 Near me</button>
      <button class="chip" data-place="Sydney" aria-pressed="false">Sydney</button>
      <button class="chip" data-place="Melbourne" aria-pressed="false">Melbourne</button>
    </div>
    <div class="chips" role="group" aria-label="When">
      <button class="chip" data-when="now" aria-pressed="false">🔥 On now</button>
      <button class="chip" data-when="today" aria-pressed="false">Today</button>
      <button class="chip" data-when="all" aria-pressed="false">All week</button>
    </div>
    <button class="surprise" id="surprise">🎲 Pick a bar for me</button>
  </div>

  <p class="note" id="note" aria-live="polite"></p>
  <ul class="list" id="list"></ul>

  <footer>
    18+ only. Drink responsibly and check deals with the bar before you go.<br>
    Know a happy hour we're missing? <a href="https://github.com/sanj2888/Happy-Hour/issues/new?title=Happy%20hour%20suggestion" target="_blank" rel="noopener">Spill the tea</a>
  </footer>
</div>

<script src="venues.js"></script>
<script>
(function () {
  var CITIES = {
    Sydney: { tz: "Australia/Sydney", state: "NSW", lat: -33.8688, lon: 151.2093 },
    Melbourne: { tz: "Australia/Melbourne", state: "VIC", lat: -37.8136, lon: 144.9631 },
  };
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var FAR_AWAY_KM = 100;
  var STORE = "happy-hour-settings";

  var venues = (window.VENUES || []).map(function (v) {
    return Object.assign({}, v, { slots: parseHours(v.hours || []) });
  });

  var state = { place: "near", when: "now", me: null };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || "{}");
    if (saved.place) state.place = saved.place;
    if (saved.when) state.when = saved.when;
  } catch (e) {}

  // ----- Reading the hours -----

  // Turns [{days: "Mon, Thu-Sun", from: "16:00", to: "18:00"}] into
  // [{day: 1, from: 960, to: 1080}, ...] (minutes after midnight).
  function parseHours(hours) {
    var slots = [];
    hours.forEach(function (h) {
      var from = toMinutes(h.from), to = toMinutes(h.to);
      if (from == null || to == null) return;
      dayList(h.days).forEach(function (d) { slots.push({ day: d, from: from, to: to }); });
    });
    return slots;
  }

  function toMinutes(t) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(t || "").trim());
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }

  function dayIndex(name) {
    var i = DAYS.indexOf(String(name).trim().slice(0, 3).replace(/^./, function (c) { return c.toUpperCase(); }));
    return i < 0 ? null : i;
  }

  function dayList(text) {
    text = String(text || "").trim();
    if (/^(daily|every ?day)$/i.test(text)) return [0, 1, 2, 3, 4, 5, 6];
    var out = [];
    text.split(",").forEach(function (part) {
      var ends = part.split("-");
      var a = dayIndex(ends[0]);
      var b = ends.length > 1 ? dayIndex(ends[1]) : a;
      if (a == null || b == null) return;
      for (var d = a; ; d = (d + 1) % 7) {
        if (out.indexOf(d) < 0) out.push(d);
        if (d === b) break;
      }
    });
    return out;
  }

  // ----- Time in the venue's city -----

  function cityNow(city) {
    var parts = new Intl.DateTimeFormat("en-AU", {
      timeZone: CITIES[city].tz, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    }).formatToParts(new Date());
    var get = function (type) { return (parts.find(function (p) { return p.type === type; }) || {}).value; };
    return { day: dayIndex(get("weekday")), mins: Number(get("hour")) * 60 + Number(get("minute")) };
  }

  function clock(mins) {
    mins = ((mins % 1440) + 1440) % 1440;
    var h = Math.floor(mins / 60), m = mins % 60;
    var suffix = h < 12 ? "am" : "pm";
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + (m ? ":" + String(m).padStart(2, "0") : "") + " " + suffix;
  }

  function wait(mins) {
    if (mins < 60) return mins + " min";
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + " hr" + (m ? " " + m + " min" : "");
  }

  function onNow(minsLeft, to) {
    var label = minsLeft <= 90 ? "On now · " + wait(minsLeft) + " left" : "On till " + clock(to);
    return { kind: "on", rank: 0, label: label, today: true, minsLeft: minsLeft };
  }

  // Works out whether a venue's happy hour is on now, later today or another day.
  function status(v) {
    var now = cityNow(v.city);
    var yesterday = (now.day + 6) % 7;
    var best = null;
    for (var i = 0; i < v.slots.length; i++) {
      var s = v.slots[i];
      var overnight = s.to <= s.from;
      if (s.day === now.day && now.mins >= s.from && (overnight || now.mins < s.to)) {
        return onNow(overnight ? s.to + 1440 - now.mins : s.to - now.mins, s.to);
      }
      if (overnight && s.day === yesterday && now.mins < s.to) {
        return onNow(s.to - now.mins, s.to);
      }
    }
    // Next start within the coming week.
    for (var ahead = 0; ahead < 8; ahead++) {
      var day = (now.day + ahead) % 7;
      v.slots.forEach(function (s) {
        if (s.day !== day) return;
        var minsAway = ahead * 1440 + s.from - now.mins;
        if (minsAway <= 0) return;
        if (!best || minsAway < best.minsAway) best = { minsAway: minsAway, slot: s, ahead: ahead };
      });
      if (best) break;
    }
    var endedToday = v.slots.filter(function (s) { return s.day === now.day && s.to > s.from && now.mins >= s.to; });
    if (best && best.ahead === 0) {
      var soon = best.minsAway <= 120;
      return {
        kind: "soon", rank: 1, today: true,
        label: soon ? "Starts in " + wait(best.minsAway) : "Starts " + clock(best.slot.from),
        minsAway: best.minsAway,
      };
    }
    if (endedToday.length) {
      return { kind: "off", rank: 2, today: true, label: "Done for today", minsAway: best ? best.minsAway : 1e9 };
    }
    if (best) {
      var when = best.ahead === 1 ? "Tomorrow" : DAYS[best.slot.day];
      return { kind: "off", rank: 3, today: false, label: when + " " + clock(best.slot.from), minsAway: best.minsAway };
    }
    return { kind: "off", rank: 4, today: false, label: "No times listed", minsAway: 1e9 };
  }

  // Groups the hours for display, e.g. "Mon–Fri, 4 pm to 7 pm".
  function hoursText(v) {
    return (v.hours || []).map(function (h) {
      var days = /^(daily|every ?day)$/i.test(String(h.days).trim()) ? "Every day" : h.days.replace(/-/g, "–");
      return days + ", " + clock(toMinutes(h.from)) + " to " + clock(toMinutes(h.to));
    }).join(" · ");
  }

  // ----- Distance -----

  function km(a, b) {
    var rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    var x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    return 6371 * 2 * Math.asin(Math.sqrt(x));
  }

  function distanceText(d) {
    if (d < 1) return Math.max(50, Math.round(d * 20) * 50) + " m away";
    if (d < 10) return d.toFixed(1) + " km away";
    return Math.round(d) + " km away";
  }

  function nearestCity(me) {
    var best = null;
    Object.keys(CITIES).forEach(function (c) {
      var d = km(me, CITIES[c]);
      if (!best || d < best.d) best = { city: c, d: d };
    });
    return best;
  }

  // ----- Screen -----

  var listEl = document.getElementById("list");
  var noteEl = document.getElementById("note");
  var shown = [];

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ place: state.place, when: state.when })); } catch (e) {}
  }

  function city() {
    if (state.place !== "near") return state.place;
    return state.me ? nearestCity(state.me).city : "Sydney";
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function mapsLink(v) {
    var q = v.name + ", " + v.area + " " + CITIES[v.city].state;
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  }

  function checkedText(iso) {
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return "";
    return "Checked " + d.toLocaleDateString("en-AU", { day: "numeric", month: "short" });
  }

  function render() {
    document.querySelectorAll("[data-place]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.place === state.place));
    });
    document.querySelectorAll("[data-when]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.when === state.when));
    });

    var c = city();
    var useDistance = state.place === "near" && state.me && nearestCity(state.me).d <= FAR_AWAY_KM;
    var rows = venues
      .filter(function (v) { return v.city === c; })
      .map(function (v) {
        return { v: v, s: status(v), d: useDistance ? km(state.me, v) : null };
      })
      .filter(function (r) {
        if (state.when === "now") return r.s.kind === "on";
        if (state.when === "today") return r.s.today;
        return true;
      });

    rows.sort(function (a, b) {
      if (state.when !== "all" || !useDistance) {
        if (a.s.rank !== b.s.rank) return a.s.rank - b.s.rank;
        if (!useDistance && a.s.minsAway !== b.s.minsAway) return (a.s.minsAway || 0) - (b.s.minsAway || 0);
      }
      if (useDistance) return a.d - b.d;
      return a.v.name.localeCompare(b.v.name);
    });
    shown = rows;

    listEl.textContent = "";
    if (!rows.length) {
      var empty = el("li", "empty");
      var isNow = state.when === "now";
      empty.appendChild(el("div", "big", isNow ? "🌵" : "😴"));
      empty.appendChild(el("h2", "display", isNow ? "Dry spell" : "Quiet day"));
      empty.appendChild(el("p", null, isNow
        ? "No happy hours pouring in " + c + " right now."
        : "No happy hours in " + c + " today."));
      var btn = el("button", "chip", isNow ? "See what's on later today" : "See the whole week");
      btn.addEventListener("click", function () {
        state.when = isNow ? "today" : "all";
        save();
        render();
      });
      empty.appendChild(btn);
      listEl.appendChild(empty);
      return;
    }

    rows.forEach(function (r) {
      var v = r.v;
      var li = el("li", "card");
      var top = el("div", "top");
      var head = el("div");
      head.appendChild(el("h2", "name display", v.name));
      head.appendChild(el("p", "where", "📍 " + v.area + (r.d != null ? " · " + distanceText(r.d) : "")));
      top.appendChild(head);
      top.appendChild(el("span", "badge " + r.s.kind, r.s.label));
      li.appendChild(top);
      li.appendChild(el("p", "deal", v.deal));
      li.appendChild(el("p", "hours", "🕓 " + hoursText(v)));

      var actions = el("div", "actions");
      var dir = el("a", "go", "Take me there →");
      dir.href = mapsLink(v);
      dir.target = "_blank";
      dir.rel = "noopener";
      actions.appendChild(dir);
      if (v.source) {
        var src = el("a", "src", "Source");
        src.href = v.source;
        src.target = "_blank";
        src.rel = "noopener";
        actions.appendChild(src);
      }
      if (v.checked) actions.appendChild(el("span", "checked", checkedText(v.checked)));
      li.appendChild(actions);
      listEl.appendChild(li);
    });
  }

  function setNote(text) { noteEl.textContent = text || ""; }

  function placeNote() {
    if (state.place !== "near") { setNote("Showing " + state.place + "."); return; }
    if (!state.me) return;
    var near = nearestCity(state.me);
    if (near.d > FAR_AWAY_KM) {
      setNote("You're not near Sydney or Melbourne yet, so here's " + near.city + ", the closest city.");
    } else {
      setNote("Bars near you in " + near.city + ", closest first.");
    }
  }

  function locate() {
    if (!navigator.geolocation) {
      setNote("This browser can't share your location. Pick a city instead.");
      return;
    }
    setNote("Finding where you are…");
    navigator.geolocation.getCurrentPosition(function (pos) {
      state.me = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      placeNote();
      render();
    }, function (err) {
      var iphone = /iPhone|iPad|iPod/.test(navigator.userAgent);
      if (err && err.code === 1) {
        setNote(iphone
          ? "Your phone is blocking location for this app. Open Settings > Privacy & Security > Location Services, make sure it's on, then tap Safari Websites and choose While Using the App. Then tap Near me again."
          : "Your phone is blocking location for this app. Tap the icon to the left of the web address, choose Permissions (or Site settings) > Location > Allow, and check Location is on in your phone's settings. Then tap Near me again.");
      } else {
        setNote("We couldn't find where you are just now. Check Location is on in your phone's settings, then tap Near me again.");
      }
      render();
    }, { enableHighAccuracy: false, timeout: 20000, maximumAge: 300000 });
  }

  // Picks a random bar from what's on screen (on now first), and shows it off.
  function surprise() {
    if (!shown.length && state.when !== "all") {
      state.when = state.when === "now" ? "today" : "all";
      save();
      render();
    }
    if (!shown.length) return;
    var pool = shown.filter(function (r) { return r.s.kind === "on"; });
    if (!pool.length) pool = shown;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    var card = listEl.children[shown.indexOf(pick)];
    document.querySelectorAll(".card.picked").forEach(function (c) { c.classList.remove("picked"); });
    card.classList.add("picked");
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    setNote("Tonight's pick: " + pick.v.name + " 🎉");
  }

  document.querySelectorAll("[data-place]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.place = b.dataset.place;
      save();
      if (state.place === "near") locate(); else placeNote();
      render();
    });
  });
  document.querySelectorAll("[data-when]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.when = b.dataset.when;
      save();
      render();
    });
  });
  document.getElementById("surprise").addEventListener("click", surprise);

  if (state.place === "near") locate(); else placeNote();
  render();
  // Keep "On now" and "Starts in" up to date while the page is open.
  setInterval(function () {
    var picked = document.querySelector(".card.picked");
    if (!picked) render();
  }, 60000);
})();
</script>
</body>
</html>
